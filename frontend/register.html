<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | KOLO MUSIC</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ==========================================
     REGISTER PAGE
========================================== -->

    <section class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">🎵 KOLO MUSIC</div>

        <h1>Create Account</h1>

        <p>Join Liberia's music community.</p>

        <div id="registerMessage"></div>

        <form id="registerForm">
          <input type="text" id="fullName" placeholder="Full name" required />

          <input type="email" id="email" placeholder="Email address" required />

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />

          <input type="text" id="phone" placeholder="Phone number" />

          <label for="role">Account Type</label>

          <select id="role" name="role">
            <option value="listener">Listener</option>

            <option value="artist">Artist</option>
          </select>

          <div id="artistFields" style="display: none">
            <input type="text" id="artistName" placeholder="Artist name" />

            <textarea id="bio" placeholder="Artist bio"></textarea>
          </div>

          <button type="submit" class="primary-btn">Create Account</button>
        </form>

        <p class="auth-link">
          Already have an account?

          <a href="login.html"> Login </a>
        </p>
      </div>
    </section>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script>
      // Show artist fields

      const roleSelect = document.getElementById("role");

      const artistFields = document.getElementById("artistFields");

      roleSelect.addEventListener(
        "change",

        () => {
          if (roleSelect.value === "artist") {
            artistFields.style.display = "block";
          } else {
            artistFields.style.display = "none";
          }
        },
      );
    </script>
  </body>
</html>
